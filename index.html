<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Conviviale Ops</title>
  <meta name="theme-color" content="#5c5d46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Conviviale Ops">
  <link rel="icon" href="assets/rings.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aboreto&family=Montserrat:wght@400;500;600;700&display=swap">
  <!-- Release version. Bump it (and the two ?v= below) on every deploy so browsers fetch
       all files fresh together instead of mixing cached old modules with new ones.
       Every module in js/ must be listed here. -->
  <script type="importmap">
  {
    "imports": {
      "./js/auth.js": "./js/auth.js?v=2026-10-01.1",
      "./js/config.js": "./js/config.js?v=2026-10-01.1",
      "./js/costing.js": "./js/costing.js?v=2026-10-01.1",
      "./js/icons.js": "./js/icons.js?v=2026-10-01.1",
      "./js/main.js": "./js/main.js?v=2026-10-01.1",
      "./js/recipe-cost.js": "./js/recipe-cost.js?v=2026-10-01.1",
      "./js/recipe-paste.js": "./js/recipe-paste.js?v=2026-10-01.1",
      "./js/sheets.js": "./js/sheets.js?v=2026-10-01.1",
      "./js/store.js": "./js/store.js?v=2026-10-01.1",
      "./js/ui.js": "./js/ui.js?v=2026-10-01.1",
      "./js/units.js": "./js/units.js?v=2026-10-01.1",
      "./js/views/ingredients.js": "./js/views/ingredients.js?v=2026-10-01.1",
      "./js/views/recipes.js": "./js/views/recipes.js?v=2026-10-01.1",
      "./js/views/suppliers.js": "./js/views/suppliers.js?v=2026-10-01.1"
    }
  }
  </script>
  <link rel="stylesheet" href="css/app.css?v=2026-10-01.1">
  <script type="module" src="js/main.js?v=2026-10-01.1"></script>
</head>
<body>
  <div id="loading" class="screen splash">
    <div class="rings-loader" aria-hidden="true"></div>
    <img class="splash-wordmark" src="assets/wordmark-olive.svg" alt="Conviviale">
    <p class="overline">Ops</p>
    <p id="loading-msg" class="muted">Loading…</p>
  </div>

  <div id="signin" class="screen splash rings-corners" hidden>
    <div class="splash-card">
      <img class="splash-wordmark" src="assets/wordmark-olive.svg" alt="Conviviale">
      <p class="overline">Ops</p>
      <p class="muted">Food cost, recipes and stock for the team.</p>
      <p id="signin-msg" class="form-error" role="alert" hidden></p>
      <button id="signin-btn" class="btn primary block lg">Sign in with Google</button>
      <p class="muted small">Use your @conviviale.co.uk account.</p>
    </div>
  </div>

  <div id="fatal" class="screen splash rings-corners" hidden>
    <div class="splash-card">
      <img class="splash-wordmark" src="assets/wordmark-olive.svg" alt="Conviviale">
      <h1 class="title">Something went wrong</h1>
      <p id="fatal-msg" class="form-error" role="alert"></p>
      <button id="retry-btn" class="btn primary block">Try again</button>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <a class="brand" href="#/ingredients" aria-label="Conviviale Ops home">
        <img src="assets/wordmark-white.svg" alt="Conviviale">
        <span class="brand-sub">Ops</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/ingredients" data-route="ingredients">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14zM5 19l7-7"/></svg>
          <span>Ingredients</span>
        </a>
        <a href="#/suppliers" data-route="suppliers">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
          <span>Suppliers</span>
        </a>
        <a href="#/recipes" data-route="recipes">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM5 18a2 2 0 0 1 2-2h11M9 8h5"/></svg>
          <span>Recipes</span>
        </a>
        <span class="soon" aria-disabled="true" title="Coming soon">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7 9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></svg>
          <span>Stock</span><small>Soon</small>
        </span>
      </nav>
      <div class="top-actions">
        <button id="refresh-btn" class="icon-btn on-dark" aria-label="Refresh data from the spreadsheet" title="Refresh">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg>
        </button>
        <details class="account">
          <summary class="avatar" aria-label="Account"><span id="user-initial">·</span></summary>
          <div class="menu">
            <p id="user-email" class="small muted"></p>
            <a id="sheet-link" class="menu-item" target="_blank" rel="noopener">Open the spreadsheet</a>
            <button id="signout-btn" class="menu-item">Sign out</button>
          </div>
        </details>
      </div>
    </header>
    <div id="banner" class="banner" role="alert" hidden>
      <span>Your Google session has expired. Nothing you've typed is lost.</span>
      <button id="reconnect-btn" class="btn primary sm">Reconnect</button>
    </div>
    <main id="view"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
